name: Update market data

on:
  schedule:
    # Runs every weekday morning before the Hong Kong market opens.
    - cron: "0 0 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh cached market data
        run: python scripts/update_market_data.py

      - name: Commit refreshed data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_prices.csv data/market_metadata.json
          if git diff --cached --quiet; then
            echo "No market data changes to commit."
          else
            git commit -m "Update cached market data"
            git push
          fi
